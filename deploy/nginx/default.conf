# Reverse proxy a gunicorn (servicio `web`, puerto 8000 interno del compose).
# Estático y media: sin S3 (USE_S3=False, el default en settings/production.py),
# quedan en los volúmenes static_data/media_data del compose — nginx los sirve
# directo desde ahí (más rápido, y no gasta un worker de gunicorn en eso).
#
# Sin dominio todavía: solo HTTP. Cuando haya dominio + certbot, sumar un
# server{} en 443 con ssl_certificate/ssl_certificate_key y redirigir este
# bloque de 80 a https (o dejar que Django lo haga vía SECURE_SSL_REDIRECT,
# volviendo a activarlo en el .env).

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # A nivel de server: las heredan location / y location /healthz/. Sin
    # esto, nginx le manda a Django el Host "web:8000" (el proxy_pass) en vez
    # del Host real del cliente -> DisallowedHost / 400 (pasó en la prueba).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /healthz/ {
        proxy_pass http://web:8000;
        access_log off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
    }
}
