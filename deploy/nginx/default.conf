# Reverse proxy a gunicorn (servicio `web`, puerto 8000 interno del compose).
# Estático y media van directo a S3 (STORAGES en settings/production.py), así
# que no hace falta un location para eso acá.
#
# Sin dominio todavía: solo HTTP. Cuando haya dominio + certbot, sumar un
# server{} en 443 con ssl_certificate/ssl_certificate_key y redirigir este
# bloque de 80 a https (o dejar que Django lo haga vía SECURE_SSL_REDIRECT,
# volviendo a activarlo en el .env).

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /healthz/ {
        proxy_pass http://web:8000;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
